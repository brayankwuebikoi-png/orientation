<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orientation.cm - Guide Post-Bac Cameroun</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet"><style>body{font-family:'Plus Jakarta Sans',sans-serif}</style></head><body class="bg-[#f7f5ff]"><header class="bg-white sticky top-0 z-10 p-4 flex justify-between items-center border-b"><b class="text-[#5b2cd6] text-xl">ORIENTATION.CM</b><a href="#" class="bg-[#5b2cd6] text-white px-4 py-2 rounded-full text-xs font-bold">Rejoindre WhatsApp</a></header><div class="bg-[#5b2cd6] text-white p-8 pb-16 text-center"><h1 class="text-[32px] font-[800] leading-tight">Trouve ta voie après le Bac</h1><p class="opacity-80 mt-3">Le seul guide qui regroupe toutes les écoles du Cameroun</p><div class="bg-white p-2 rounded-[20px] flex gap-2 max-w-2xl mx-auto mt-6 shadow-xl"><input id="q" oninput="go()" placeholder="Ex: Informatique, Douala, Médecine..." class="flex-1 p-3 text-black outline-none rounded-xl"><button class="bg-[#5b2cd6] px-6 rounded-xl font-bold">Chercher</button></div></div><div class="max-w-5xl mx-auto p-4 -mt-8 grid grid-cols-1 md:grid-cols-2 gap-4" id="grid"></div><script>
const data=[
{name:"Université de Yaoundé I",loc:"Yaoundé",dom:"Informatique, Droit, Médecine",type:"Publique"},
{name:"IAI Cameroun - Centre d'Excellence",loc:"Yaoundé, Douala",dom:"Génie Logiciel, Réseaux, Cybersécurité",type:"Privée"},
{name:"ENSPY - Polytech Yaoundé",loc:"Yaoundé",dom:"Génie Civil, Informatique, Industriel",type:"Concours"},
{name:"ENSET Douala",loc:"Douala",dom:"Génie Mécanique, Electrique, Informatique",type:"Concours"},
{name:"FMSB - Médecine",loc:"Yaoundé",dom:"Médecine, Pharmacie, Odonto",type:"Très sélectif"},
{name:"ESSEC Douala",loc:"Douala",dom:"Marketing, Finance, Comptabilité",type:"Publique"},
{name:"Sup'PTIC",loc:"Yaoundé",dom:"Télécoms, Réseaux, Sécurité",type:"Bourse"},
{name:"IUT de Douala",loc:"Douala",dom:"Génie Industriel, Informatique, GEA",type:"IUT"},
{name:"Université de Buea",loc:"Buea",dom:"Informatique, Traduction, Sciences",type:"Anglophone"},
{name:"Siantou Sup",loc:"Yaoundé",dom:"Informatique, Gestion, Réseau",type:"Privée"}
];
const grid=document.getElementById('grid');
function render(list){grid.innerHTML=list.map(s=>`<div class="bg-white p-5 rounded-[20px] border shadow-sm"><div class="flex justify-between"><b>${s.name}</b><span class="text-[10px] bg-[#efeaff] text-[#5b2cd6] px-2 py-1 rounded-full h-fit">${s.type}</span></div><p class="text-sm text-gray-500 mt-1">📍 ${s.loc} • ${s.dom}</p><button class="mt-3 text-[#5b2cd6] text-sm font-bold">Voir les débouchés →</button></div>`).join('')}
function go(){let v=q.value.toLowerCase();render(data.filter(s=>(s.name+s.loc+s.dom).toLowerCase().includes(v)))}
render(data);
</script><div class="text-center p-10 text-gray-400 text-sm">Fait par BRAYAN pour tous les bacheliers du Cameroun 🇨🇲<br>orientation.cm - 2026</div></body></html>
